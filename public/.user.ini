; Raises PHP's upload limits above the app's own validation ceiling
; (max:5120, i.e. 5MB per image — see PropertiesController, Announcements
; Controller, TeamMembersController). Without this, a cPanel host's default
; upload_max_filesize (often 2M) rejects the upload before Laravel's own
; validation ever runs, producing a raw PostTooLargeException page instead
; of a normal validation error. Added 2026-09-04 after this happened for
; real on a team-member photo upload.
;
; Most cPanel hosts (PHP-FPM/suPHP) pick this up automatically for anything
; served from this directory (public_html). If it's ignored, use cPanel's
; MultiPHP INI Editor instead — see deploy/README.md section 1.6.

upload_max_filesize = 6M
post_max_size = 40M
