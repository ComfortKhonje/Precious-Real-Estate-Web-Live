---
# cPanel Git Version Control deployment task.
#
# How this works: cPanel clones the repo into a folder OUTSIDE the document
# root (the "repository path"), then runs the tasks below whenever you press
# "Deploy HEAD Commit" in cPanel -> Git Version Control.
#
# Layout this assumes on the server:
#
#   /home/USER/repositories/precious-real-estate-web/   <- cPanel clone
#   /home/USER/precious-real-estate-web/                <- the live Laravel app
#   /home/USER/public_html/                             <- document root
#                                                          (holds public/ contents
#                                                           + deploy/public_html-index.php
#                                                           renamed to index.php)
#
# BEFORE the first deploy, set DEPLOYPATH below to the real cPanel username
# and confirm the paths. See deploy/README.md for the full first-time setup.
#
# Note: composer/npm are frequently unavailable on shared cPanel plans. That
# is why public/build (compiled CSS/JS) and vendor-free assets are committed
# to the repo, and why this file does NOT run `npm install`.
deployment:
  tasks:
    - export DEPLOYPATH=/home/CPANELUSER/precious-real-estate-web
    - export DOCROOT=/home/CPANELUSER/public_html

    # Application code
    - /bin/cp -R app $DEPLOYPATH/
    - /bin/cp -R bootstrap $DEPLOYPATH/
    - /bin/cp -R config $DEPLOYPATH/
    - /bin/cp -R database $DEPLOYPATH/
    - /bin/cp -R resources $DEPLOYPATH/
    - /bin/cp -R routes $DEPLOYPATH/
    - /bin/cp -R tests $DEPLOYPATH/
    - /bin/cp artisan composer.json composer.lock $DEPLOYPATH/

    # Public assets into the document root (NOT the .env, NOT the app code)
    - /bin/cp -R public/. $DOCROOT/
    - /bin/cp deploy/public_html-index.php $DOCROOT/index.php

    # Dependencies + caches. If composer is not on PATH for this account,
    # comment the composer line out and upload vendor/ once by SFTP instead.
    - cd $DEPLOYPATH && /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction
    - cd $DEPLOYPATH && /usr/local/bin/php artisan migrate --force
    - cd $DEPLOYPATH && /usr/local/bin/php artisan storage:link
    - cd $DEPLOYPATH && /usr/local/bin/php artisan config:cache
    - cd $DEPLOYPATH && /usr/local/bin/php artisan route:cache
    - cd $DEPLOYPATH && /usr/local/bin/php artisan view:cache
