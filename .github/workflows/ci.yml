name: CI

# Runs on every push and pull request. Three things it protects:
#   1. the test suite still passes (49 tests as of 2026-09-03)
#   2. the committed public/build output actually matches the source — shared
#      cPanel hosting has no Node, so a stale committed build ships broken
#      CSS/JS to production with nothing else to catch it
#   3. no known-vulnerable PHP dependencies

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, fileinfo, mbstring, pdo_sqlite, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit PHP dependencies
        run: composer audit

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  assets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Rebuild assets
        run: npm run build

      - name: Fail if the committed build is stale
        run: |
          if [ -n "$(git status --porcelain public/build)" ]; then
            echo "::error::public/build is out of date. Run 'npm run build' and commit the result."
            git status --porcelain public/build
            exit 1
          fi
          echo "Committed build matches source."
